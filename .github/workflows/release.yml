name: Release

# Runs whenever a version tag (e.g. v1.2.0) is pushed. Builds the .dmg on a
# clean macOS runner and publishes a GitHub release with it attached.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build the .dmg
        run: ./scripts/make-dmg.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" build/blipsy.dmg \
            --title "blipsy ${GITHUB_REF_NAME}" \
            --generate-notes
