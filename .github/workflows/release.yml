name: Release

# Runs whenever a version tag (e.g. v1.2.0) is pushed. Builds the .dmg on a
# clean macOS runner and publishes a GitHub release with it attached.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true       # fetch annotated tag objects so we can read their message

      - name: Show toolchain
        run: swift --version

      - name: Build the .dmg
        run: ./scripts/make-dmg.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # Read the annotated tag's message from the API as the changelog.
          # Reading it from the checked-out git repo proved unreliable on the runner.
          REF=$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha + " " + .object.type')
          SHA=${REF% *}; TYPE=${REF#* }
          if [ "$TYPE" = "tag" ]; then
            NOTES=$(gh api "repos/$REPO/git/tags/$SHA" --jq '.message')
          else
            NOTES="See the commit history for changes."
          fi
          gh release create "$TAG" build/blipsy.dmg --title "blipsy $TAG" --notes "$NOTES"
